[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-testimonials"
version = "1.0.1"
description = "High-performance Django package for managing customer testimonials at scale"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "NzeStan", email = "nnamaniifeanyi10@gmail.com"}
]
maintainers = [
    {name = "NzeStan", email = "nnamaniifeanyi10@gmail.com"}
]
keywords = ["django", "testimonials", "reviews", "feedback", "api", "rest"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
requires-python = ">=3.10"
dependencies = [
    "Django>=4.2",
    "djangorestframework>=3.12.0",
    "django-filter>=22.1",
    "django-phonenumber-field[phonenumbers]>=7.0.0",
    "Pillow>=8.0.0",
]

[project.optional-dependencies]
performance = [
    "django-background-tasks>=1.2.5",
]
dev = [
    "pytest>=7.0.0",
    "pytest-django>=4.5.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "pre-commit>=2.20.0",
    "factory-boy>=3.2.0",
    "Faker>=15.0.0",
    "django-background-tasks>=1.2.5",
]

[project.urls]
Homepage = "https://github.com/NzeStan/django-testimonials"
Documentation = "https://django-testimonials.readthedocs.io/"
Repository = "https://github.com/NzeStan/django-testimonials"
"Bug Tracker" = "https://github.com/NzeStan/django-testimonials/issues"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = "test_*.py"
python_classes = "Test*"
testpaths = ["testimonials/tests"]
pythonpath = ["."]
addopts = "--nomigrations --reuse-db"
norecursedirs = [".env", ".git", "testimonials/models"]
filterwarnings = [
    "ignore:The FORMS_URLFIELD_ASSUME_HTTPS transitional setting is deprecated:django.utils.deprecation.RemovedInDjango60Warning",
]

[tool.setuptools.packages.find]
include = ["testimonials*"]

[tool.setuptools.package-data]
testimonials = [
    "templates/**/*.html",
    "static/**/*",
    "locale/**/*",
]